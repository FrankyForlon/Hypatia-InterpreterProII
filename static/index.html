<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Constance Interpreter Pro</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0f0f0f;color:#fff;height:100vh;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column}
.header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1a1a1a;border-bottom:1px solid #333}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444}
.dot.on{background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.toggle-btn{background:#333;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.nav{flex-shrink:0;display:flex;background:#1a1a1a;border-bottom:1px solid #333}
.nav-btn{flex:1;padding:12px;background:none;border:none;color:#888;font-size:14px;cursor:pointer}
.nav-btn.active{color:#fff;border-bottom:2px solid #22c55e}
.main{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px;overflow-y:auto}
.hidden{display:none}
.segment{background:#1e1e1e;border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.seg-src{color:#ccc;font-size:15px;margin-bottom:6px;line-height:1.5}
.seg-tgt{color:#22c55e;font-size:16px;margin-bottom:6px;line-height:1.5}
.seg-meta{color:#666;font-size:11px;display:flex;gap:8px;align-items:center}
.word{cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .2s}
.word:hover{background:rgba(34,197,94,.25)}
.delete-btn{position:absolute;top:8px;right:8px;background:#333;color:#ef4444;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.delete-btn:hover{background:#ef4444;color:#fff}
.input-row{display:flex;gap:8px;padding:10px;background:#1a1a1a;border-top:1px solid #333}
.input-row input{flex:1;background:#222;border:1px solid #444;color:#fff;padding:10px 14px;border-radius:24px;font-size:15px;outline:none}
.input-row input::placeholder{color:#666}
.input-row button{background:#22c55e;color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{color:#666;text-align:center;padding:40px 20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.modal-box{background:#1e1e1e;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:#333;color:#fff;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
.dict-word{font-size:22px;font-weight:700;margin-bottom:8px;color:#fff}
.dict-pos{color:#888;font-size:13px;margin-bottom:12px}
.dict-def{color:#ccc;font-size:15px;line-height:1.6;margin-bottom:12px}
.dict-ru{color:#22c55e;font-size:15px;margin-bottom:12px}
.dict-rel{color:#888;font-size:13px}
.glossary-list{padding:0 10px 10px}
.gloss-item{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:10px}
.gloss-en{color:#fff;font-size:16px;font-weight:600;margin-bottom:4px}
.gloss-ru{color:#22c55e;font-size:15px;margin-bottom:6px}
.gloss-def{color:#999;font-size:14px;line-height:1.5}
.saved-item{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.saved-info{flex:1}
.saved-title{color:#fff;font-size:15px;margin-bottom:4px}
.saved-date{color:#888;font-size:12px}
.saved-actions{display:flex;gap:8px}
.icon-btn{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.icon-btn:hover{background:#444}
.start-overlay{position:fixed;inset:0;background:#0f0f0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.start-btn{background:#22c55e;color:#fff;border:none;padding:18px 40px;border-radius:30px;font-size:18px;font-weight:600;cursor:pointer;margin-top:20px}
.start-sub{color:#888;font-size:14px;margin-top:12px;text-align:center;padding:0 30px}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.onerror=function(msg,url,line){document.body.innerHTML='<pre style=color:red;padding:20px>Error: '+msg+' at line '+line+'</pre>';};
const {useState,useEffect,useRef} = React;

const GLOSSARY=[
{en:"Angiography",ru:"Angiografiya",def:"Imaging of blood vessels using contrast dye and X-rays."},
{en:"Biopsy",ru:"Biopsiya",def:"Extraction of tissue sample for diagnostic examination."},
{en:"Catheter",ru:"Katyeter",def:"Thin tube inserted into body cavities for drainage or access."},
{en:"Dialysis",ru:"Dializ",def:"Filtration procedure to remove waste from blood when kidneys fail."},
{en:"Electrode",ru:"Elektrod",def:"Conductor used to make contact with non-metallic circuit parts."},
{en:"Fluoroscopy",ru:"Fluoroskopiya",def:"Real-time moving X-ray imaging for guiding procedures."},
{en:"Graft",ru:"Transplantat",def:"Tissue or device implanted to replace/repair body part."},
{en:"Hemodynamics",ru:"Gemodinamika",def:"Study of blood flow and forces affecting circulation."},
{en:"Impedance",ru:"Impedans",def:"Opposition to alternating current flow in a circuit."},
{en:"Laparoscopy",ru:"Laparoskopiya",def:"Minimally invasive abdominal surgery using camera."},
{en:"Microfluidics",ru:"Mikrofluidika",def:"Science of manipulating fluids in sub-millimeter channels."},
{en:"Neurostimulator",ru:"Neyrostimulyator",def:"Implantable device delivering electrical impulses to nervous system."},
{en:"Orthosis",ru:"Ortez",def:"External device modifying structural/functional body characteristics."},
{en:"Pacemaker",ru:"Elektrokardiostimulyator",def:"Implantable device regulating heartbeat via electrical impulses."},
{en:"Resonance",ru:"Rezonans",def:"Amplified oscillation at natural frequency of system."},
{en:"Stent",ru:"Stent",def:"Mesh tube inserted to open narrow/passage vessel."},
{en:"Telemetry",ru:"Telemetriya",def:"Remote transmission of measurements to receiving equipment."},
{en:"Tomography",ru:"Tomografiya",def:"Imaging by sections using penetrating waves."},
{en:"Ultrasonography",ru:"Ultrasonografiya",def:"Imaging using high-frequency sound waves."},
{en:"Vascular",ru:"Sosudisty",def:"Relating to blood vessels and circulation."}
];

let recognition=null;
function getRec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;return new R()}

function useSpeech(onResult,lang,listening){useEffect(()=>{if(!listening)return;const r=getRec();if(!r)return;r.continuous=true;r.interimResults=true;r.lang=lang;r.onresult=(e)=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const t=e.results[i][0].transcript;if(t.trim())onResult(t.trim())}}};r.onerror=(e)=>{console.log("rec error",e.error)};r.start();recognition=r;return()=>{try{r.stop()}catch(e){}}},[listening,lang]);}

async function translateMyMemory(text,source,target){try{const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+source+"|"+target;const r=await fetch(url);const d=await r.json();if(d.responseStatus===200&&d.responseData&&d.responseData.translatedText)return d.responseData.translatedText;return null;}catch(e){return null;}}

async function translateLibre(text,source,target){const urls=["https://libretranslate.de/translate","https://libretranslate.com/translate"];for(let url of urls){try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:text,source,target,format:"text"})});const d=await r.json();if(d.translatedText)return d.translatedText;}catch(e){}}return null;}

async function translate(text,source,target){if(!text||text.length<2)return text;const mm=await translateMyMemory(text,source,target);if(mm&&mm.toLowerCase()!==text.toLowerCase())return mm;const lt=await translateLibre(text,source,target);if(lt&&lt.toLowerCase()!==text.toLowerCase())return lt;return "["+target.toUpperCase()+"] "+text;}

async function fetchDefinition(word){try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word.toLowerCase()));const d=await r.json();if(Array.isArray(d)&&d[0]&&d[0].meanings){return d[0].meanings.map(m=>({pos:m.partOfSpeech,defs:m.definitions.slice(0,2).map(x=>x.definition)}));}}catch(e){}return null;}

function findGlossary(word){const w=word.toLowerCase().replace(/[^a-z]/gi,"");return GLOSSARY.find(g=>g.en.toLowerCase()===w||g.en.toLowerCase().includes(w));}

function WordModal({word,onClose}){
  const [data,setData]=useState(null);
  const gloss=findGlossary(word);
  useEffect(()=>{fetchDefinition(word).then(d=>setData(d));},[word]);
  return React.createElement("div",{className:"modal",onClick:onClose},
    React.createElement("div",{className:"modal-box",onClick:e=>e.stopPropagation()},
      React.createElement("button",{className:"modal-close",onClick:onClose},"X"),
      React.createElement("div",{className:"dict-word"},word),
      gloss&&React.createElement("div",{className:"dict-ru"},gloss.ru),
      gloss&&React.createElement("div",{className:"dict-def"},gloss.def),
      data&&data.map((m,i)=>React.createElement("div",{key:i,style:{marginBottom:14}},
        React.createElement("div",{className:"dict-pos"},m.pos),
        m.defs.map((def,j)=>React.createElement("div",{key:j,className:"dict-def"},"• "+def))
      )),
      !data&&!gloss&&React.createElement("div",{className:"dict-def"},"No definition found.")
    )
  );
}

function Seg({s,onTap,onDel}){
  const words=s.text.split(/(\s+)/).map((w,i)=>React.createElement("span",{key:i,className:w.trim()?"word":"",onClick:()=>w.trim()&&onTap(w.replace(/[^a-zA-Z\u0400-\u04FF]/g,""))},w));
  const tw=s.trans.split(/(\s+)/).map((w,i)=>React.createElement("span",{key:"t"+i,className:w.trim()?"word":"",onClick:()=>w.trim()&&onTap(w.replace(/[^a-zA-Z\u0400-\u04FF]/g,""))},w));
  return React.createElement("div",{className:"segment"},
    React.createElement("button",{className:"delete-btn",onClick:onDel},"x"),
    React.createElement("div",{className:"seg-src"},words),
    React.createElement("div",{className:"seg-tgt"},tw),
    React.createElement("div",{className:"seg-meta"},
      React.createElement("span",null,s.lang==="ru"?"Russian":"English"),
      React.createElement("span",null,s.time)
    )
  );
}

function LiveSession({source,target,onSave}){
  const [segs,setSegs]=useState([]);
  const [txt,setTxt]=useState("");
  const [listening,setListen]=useState(true);
  const [status,setStatus]=useState("Starting...");
  const [current,setCurrent]=useState(source);
  const [modal,setModal]=useState(null);
  const [input,setInput]=useState("");
  const bottom=useRef(null);

  useEffect(()=>{setCurrent(source);},[source]);

  useSpeech(async(t)=>{
    if(!t||t===txt)return;
    setTxt(t);
    setStatus("Listening...");
    const trans=await translate(t,current,current==="ru"?"en":"ru");
    const seg={id:Date.now(),text:t,trans,lang:current,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
    setSegs(p=>[...p,seg]);
    setTxt("");
    setTimeout(()=>bottom.current&&bottom.current.scrollIntoView({behavior:"smooth"}),100);
  },current==="ru"?"ru-RU":"en-US",listening);

  useEffect(()=>{const ok=!!getRec();setStatus(ok?(listening?"Listening...":"Paused"):"Mic unavailable");},[listening]);

  const send=()=>{if(!input.trim())return;const t=input.trim();translate(t,current,current==="ru"?"en":"ru").then(trans=>{const seg={id:Date.now(),text:t,trans,lang:current,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};setSegs(p=>[...p,seg]);setInput("");setTimeout(()=>bottom.current&&bottom.current.scrollIntoView({behavior:"smooth"}),100);});};

  const del=(id)=>setSegs(p=>p.filter(s=>s.id!==id));

  const save=()=>{if(!segs.length)return;const title="Session "+new Date().toLocaleString();const data=JSON.stringify(segs);localStorage.setItem("constance_"+Date.now(),JSON.stringify({title,date:Date.now(),data}));if(onSave)onSave();alert("Saved!");};

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},
    React.createElement("div",{className:"header"},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
        React.createElement("div",{className:"dot "+(listening?"on":"")}),
        React.createElement("span",{style:{fontSize:13,color:"#aaa"}},status)
      ),
      React.createElement("div",{style:{display:"flex",gap:8}},
        React.createElement("button",{className:"toggle-btn",onClick:()=>setListen(l=>!l)},listening?"Pause":"Resume"),
        React.createElement("button",{className:"toggle-btn",onClick:()=>setCurrent(c=>c==="ru"?"en":"ru")},current.toUpperCase()+" <-> "+(current==="ru"?"EN":"RU"))
      )
    ),
    React.createElement("div",{className:"main",style:{padding:10,overflowY:"auto"}},
      segs.length===0&&React.createElement("div",{className:"empty"},"Say something in "+(current==="ru"?"Russian":"English")+"..."),
      segs.map(s=>React.createElement(Seg,{key:s.id,s,onTap:setModal,onDel:()=>del(s.id)})),
      React.createElement("div",{ref:bottom})
    ),
    React.createElement("div",{className:"input-row"},
      React.createElement("input",{value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send(),placeholder:"Type here..."}),
      React.createElement("button",{onClick:send},">")
    ),
    React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:12,padding:"8px 0",background:"#1a1a1a",borderTop:"1px solid #333"}},
      React.createElement("button",{className:"icon-btn",onClick:save},"Save"),
      React.createElement("button",{className:"icon-btn",onClick:()=>{if(confirm("Clear all?"))setSegs([]);}},"Clear")
    ),
    modal&&React.createElement(WordModal,{word:modal,onClose:()=>setModal(null)})
  );
}

function SavedSessions({onOpen}){
  const [items,setItems]=useState([]);
  useEffect(()=>{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("constance_")).sort().reverse();
    setItems(keys.map(k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}).filter(Boolean));
  },[]);

  const del=(key)=>{localStorage.removeItem(key);setItems(p=>p.filter((_,i)=>localStorage.key(i)!==key));};
  const exp=(item,key)=>{
    const segs=JSON.parse(item.data||"[]");
    const lines=segs.map(s=>"["+s.lang+"] "+s.time+"\\nSOURCE: "+s.text+"\\nTRANS: "+s.trans).join("\\n\\n");
    const blob=new Blob([lines],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="session_"+key.replace("constance_","")+".txt";a.click();
  };

  return React.createElement("div",{style:{padding:10,overflowY:"auto",height:"100%"}},
    items.length===0&&React.createElement("div",{className:"empty"},"No saved sessions yet."),
    items.map((item,idx)=>{
      const key=Object.keys(localStorage).filter(k=>k.startsWith("constance_")).sort().reverse()[idx];
      return React.createElement("div",{className:"saved-item",key:key||idx},
        React.createElement("div",{className:"saved-info",onClick:()=>onOpen(item)},
          React.createElement("div",{className:"saved-title"},item.title||"Session"),
          React.createElement("div",{className:"saved-date"},new Date(item.date).toLocaleString())
        ),
        React.createElement("div",{className:"saved-actions"},
          React.createElement("button",{className:"icon-btn",onClick:()=>exp(item,key)},"Export"),
          React.createElement("button",{className:"icon-btn",onClick:()=>del(key)},"Del")
        )
      );
    })
  );
}

function SessionViewer({item,onBack}){
  const segs=JSON.parse(item.data||"[]");
  const [modal,setModal]=useState(null);
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},
    React.createElement("div",{className:"header"},
      React.createElement("button",{className:"toggle-btn",onClick:onBack},"<- Back"),
      React.createElement("span",{style:{fontSize:14}},item.title)
    ),
    React.createElement("div",{style:{flex:1,overflowY:"auto",padding:10}},
      segs.map(s=>React.createElement(Seg,{key:s.id,s,onTap:setModal,onDel:()=>{}}))
    ),
    modal&&React.createElement(WordModal,{word:modal,onClose:()=>setModal(null)})
  );
}

function GlossaryPage(){
  const [q,setQ]=useState("");
  const f=q?GLOSSARY.filter(g=>g.en.toLowerCase().includes(q.toLowerCase())||g.ru.toLowerCase().includes(q.toLowerCase())):GLOSSARY;
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},
    React.createElement("div",{className:"input-row"},
      React.createElement("input",{value:q,onChange:e=>setQ(e.target.value),placeholder:"Search glossary..."})
    ),
    React.createElement("div",{className:"glossary-list",style:{overflowY:"auto",flex:1}},
      f.map((g,i)=>React.createElement("div",{className:"gloss-item",key:i},
        React.createElement("div",{className:"gloss-en"},g.en),
        React.createElement("div",{className:"gloss-ru"},g.ru),
        React.createElement("div",{className:"gloss-def"},g.def)
      ))
    )
  );
}

function App(){
  const [tab,setTab]=useState("live");
  const [started,setStarted]=useState(false);
  const [viewer,setViewer]=useState(null);
  const [source,setSource]=useState("ru");

  if(!started)return React.createElement("div",{className:"start-overlay"},
    React.createElement("div",{style:{fontSize:32,fontWeight:700,marginBottom:8}},"Constance"),
    React.createElement("div",{style:{fontSize:16,color:"#22c55e",marginBottom:4}},"Interpreter Pro"),
    React.createElement("div",{className:"start-sub"},"Real-time Russian-English transcription, translation & medical glossary."),
    React.createElement("div",{className:"start-sub"},"Tap words for definitions. Save sessions for client delivery."),
    React.createElement("button",{className:"start-btn",onClick:()=>setStarted(true)},"Start Session")
  );

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100vh"}},
    React.createElement("div",{className:"nav"},
      React.createElement("button",{className:"nav-btn "+(tab==="live"?"active":""),onClick:()=>{setTab("live");setViewer(null);}},"Live"),
      React.createElement("button",{className:"nav-btn "+(tab==="saved"?"active":""),onClick:()=>{setTab("saved");setViewer(null);}},"Saved"),
      React.createElement("button",{className:"nav-btn "+(tab==="glossary"?"active":""),onClick:()=>setTab("glossary")},"Glossary")
    ),
    viewer?React.createElement(SessionViewer,{item:viewer,onBack:()=>setViewer(null)}):
    tab==="live"?React.createElement(LiveSession,{source,target:source==="ru"?"en":"ru",onSave:()=>setTab("saved")}):
    tab==="saved"?React.createElement(SavedSessions,{onOpen:setViewer}):
    React.createElement(GlossaryPage,null)
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
