// Glossary lookup helper
function gLook(w,lang){
  const c=w.toLowerCase().replace(/[^a-z\u0430-\u044f\u0451]/g,'');
  if(!c)return null;
  for(const[en,e]of Object.entries(G)){
    const ec=en.toLowerCase().replace(/[^a-z]/g,'');
    const rc=e.r.toLowerCase().replace(/[^\u0430-\u044f\u0451]/g,'');
    if(c===ec||c===rc)return{word:w,en:en,ru:e.r,def:e.d,fromGlossary:true};
  }
  return null;
}

// ====== WEB SPEECH API ======
function useWebSpeech(onMsg,lang='ru-RU'){
  const [listening,setListening]=useState(false);
  const [error,setError]=useState(null);
  const recRef=useRef(null);
  const handler=useRef(onMsg);
  handler.current=onMsg;

  const start=useCallback(async()=>{
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRecognition){setError('Speech recognition not supported.');return}
    setError(null);
    const rec=new SpeechRecognition();
    rec.continuous=true;
    rec.interimResults=true;
    rec.lang=lang;
    rec.maxAlternatives=1;
    rec.onstart=()=>setListening(true);
    rec.onend=()=>{setListening(false);recRef.current=null};
    rec.onerror=(e)=>{setError(e.error==='not-allowed'?'Mic blocked. Allow mic in browser settings.':e.error==='no-speech'?'No speech detected.':e.error==='aborted'?'Stopped':e.error);setListening(false)};
    rec.onresult=(e)=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const isFinal=e.results[i].isFinal;
        const text=e.results[i][0].transcript;
        if(text)handler.current({type:isFinal?'final':'partial',text});
      }
    };
    recRef.current=rec;
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());rec.start();}catch(e){if(e.name==='NotAllowedError')setError('Mic denied. Allow in browser settings.');else setError('Mic error: '+e.message);}
  },[lang]);

  const stop=useCallback(()=>{if(recRef.current){recRef.current.stop();recRef.current=null}setListening(false);},[]);
  useEffect(()=>()=>stop(),[stop]);
  return{listening,error,start,stop};
}

// ====== TRANSLATION ======
const TC=new Map();
async function transText(txt,s,t){
  if(!txt.trim())return'';
  const k=s+':'+t+':'+txt;
  if(TC.has(k))return TC.get(k);
  const eps=['https://libretranslate.de/translate','https://translate.argosopentech.com/translate'];
  for(const ep of eps){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:txt.trim(),source:s,target:t,format:'text'})});if(!r.ok)continue;const d=await r.json();if(d.translatedText&&d.translatedText!==txt){TC.set(k,d.translatedText);return d.translatedText}}catch{continue}}
  try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt.trim())+'&langpair='+s+'|'+t);if(r.ok){const d=await r.json();if(d.responseData?.translatedText&&d.responseData.translatedText!==txt){TC.set(k,d.responseData.translatedText);return d.responseData.translatedText}}}catch{}
  return'['+t.toUpperCase()+'] '+txt;
}

// ====== DICTIONARY ======
async function lookWord(word,lang){
  const notes=JSON.parse(localStorage.getItem('uw_'+lang)||'{}');
  const un=notes[word.toLowerCase()]||[];
  // Check glossary first
  const gl=gLook(word,lang);
  if(gl)return{word:gl.word,lang,translated:lang==='ru'?gl.en:gl.ru,glossary:gl,phonetic:'',userNotes:un,meanings:[]};
  if(lang==='en'){try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()));if(!r.ok)return{word,lang,translated:'',userNotes:un,meanings:[]};;const d=await r.json();const e=Array.isArray(d)?d[0]:d;return{word:e.word||word,lang:'en',translated:'',phonetic:e.phonetic||'',userNotes:un,meanings:(e.meanings||[]).map(m=>({ps:m.partOfSpeech,defs:(m.definitions||[]).slice(0,3).map(x=>x.definition),exs:(m.definitions||[]).filter(x=>x.example).slice(0,2).map(x=>x.example),syns:(m.synonyms||[]).slice(0,5)}))}}catch{return{word,lang:'en',translated:'',userNotes:un,meanings:[]}}}
  return{word,lang:'ru',translated:'',userNotes:un,meanings:[]};
}
function saveNote(word,lang,note,trans){
  const ex=JSON.parse(localStorage.getItem('uw_'+lang)||'{}');
  const wk=word.toLowerCase();
  if(!ex[wk])ex[wk]=[];
  ex[wk].push({note,trans,addedAt:new Date().toISOString()});
  localStorage.setItem('uw_'+lang,JSON.stringify(ex));
}

  useEffect(()=>{lookWord(word,lang).then(setData)},[word,lang]);
  const hSave=()=>{if(!nn.trim())return;saveNote(word,lang,nn,nt||undefined);setSvd(true);setNn('');setNt('');setShowAdd(false);lookWord(word,lang).then(setData);setTimeout(()=>setSvd(false),2000)};
  const spk=()=>{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(word);u.lang=lang==='en'?'en-US':'ru-RU';speechSynthesis.speak(u)}};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-panel" onClick={e=>e.stopPropagation()}>
        <div style={{padding:16,borderBottom:'1px solid #1e293b',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <h2 style={{fontSize:22,fontWeight:'bold'}}>{word}</h2>
            <button onClick={spk} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><VolumeIcon s={18}/></button>
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'transparent',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><XIcon s={20}/></button>
        </div>
        <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:14}}>
          {/* Glossary entry */}
          {data?.glossary&&(
            <div style={{padding:14,borderRadius:10,background:'rgba(251,191,36,0.08)',border:'1px solid rgba(251,191,36,0.3)'}}>
              <div style={{display:'flex',alignItems:'baseline',gap:10,flexWrap:'wrap',marginBottom:8}}>
                <span style={{fontSize:18,fontWeight:'bold',color:'#fbbf24'}}>{data.glossary.en}</span>
                <span style={{color:'#64748b'}}>/</span>
                <span style={{fontSize:16,color:'#34d399'}}>{data.glossary.ru}</span>
              </div>
              <p style={{fontSize:13,color:'#cbd5e1',lineHeight:1.6}}>{data.glossary.def}</p>
              <span style={{fontSize:10,color:'#fbbf24',marginTop:6,display:'inline-block',background:'rgba(251,191,36,0.15)',padding:'2px 8px',borderRadius:8}}>Medical Engineering Glossary</span>
            </div>
          )}
          {/* Translation (non-glossary) */}
          {data?.translated&&data.translated!=='[EN] '&&data.translated!=='[RU] '&&!data?.glossary&&(
            <div style={{padding:14,borderRadius:10,background:'rgba(37,99,235,0.1)',border:'1px solid rgba(59,130,246,0.2)'}}>
              <span style={{fontSize:16,color:'#34d399'}}>{data.translated}</span>
            </div>
          )}
          {/* Dictionary definitions (English only) */}
          {data?.meanings?.length>0&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:8,color:'#60a5fa'}}><BookOpenIcon s={16}/><span style={{fontSize:12,fontWeight:500,textTransform:'uppercase',letterSpacing:1}}>Dictionary</span></div>
              {data.meanings.map((m,i)=>(<div key={i} style={{padding:10,borderRadius:8,background:'rgba(30,41,59,0.3)'}}>
                <p style={{fontSize:11,color:'#34d399',fontWeight:500,marginBottom:6}}>{m.ps}</p>
                <ul style={{listStyle:'none',display:'flex',flexDirection:'column',gap:4}}>{m.defs.map((d,j)=>(<li key={j} style={{fontSize:13,color:'#cbd5e1',lineHeight:1.5}}>{j+1}. {d}</li>))}</ul>
                {m.exs.length>0&&<div style={{marginTop:6,paddingTop:6,borderTop:'1px solid rgba(51,65,85,0.5)'}}>{m.exs.map((ex,k)=>(<p key={k} style={{fontSize:12,color:'#64748b',fontStyle:'italic'}}>&ldquo;{ex}&rdquo;</p>))}</div>}
                {m.syns.length>0&&<div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>{m.syns.map((s,k)=>(<span key={k} style={{fontSize:11,background:'rgba(51,65,85,0.5)',color:'#94a3b8',padding:'2px 8px',borderRadius:10}}>{s}</span>))}</div>}
              </div>))}
            </div>
          )}
          {/* Context */}
          {ctx&&<div style={{padding:10,borderRadius:8,background:'rgba(30,41,59,0.5)',borderLeft:'2px solid #3b82f6'}}><p style={{fontSize:10,color:'#475569',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Context</p><p style={{fontSize:12,color:'#94a3b8',fontStyle:'italic'}}>...{ctx.length>100?ctx.substring(0,100)+'...':ctx}...</p></div>}
          {/* User notes */}
          {data?.userNotes?.length>0&&(<div style={{display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8,color:'#fbbf24'}}><MessageCircleIcon s={16}/><span style={{fontSize:12,fontWeight:500,textTransform:'uppercase',letterSpacing:1}}>Your Notes</span></div>
            {data.userNotes.map((n,i)=>(<div key={i} style={{padding:10,borderRadius:8,background:'rgba(251,191,36,0.05)',border:'1px solid rgba(251,191,36,0.2)'}}>
              {n.trans&&<p style={{color:'#34d399',fontWeight:500,fontSize:13,marginBottom:3}}>{n.trans}</p>}
              <p style={{fontSize:13,color:'#cbd5e1'}}>{n.note}</p>
            </div>))}
          </div>)}
          {/* Add note */}
          {showAdd?(<div style={{padding:10,borderRadius:8,background:'#1e293b',border:'1px solid #334155',display:'flex',flexDirection:'column',gap:10}}>
            <input value={nt} onChange={e=>setNt(e.target.value)} placeholder="Translation" style={{background:'#0f172a',border:'1px solid #334155',borderRadius:6,padding:'6px 10px',color:'#fff',fontSize:13}}/>
            <textarea value={nn} onChange={e=>setNn(e.target.value)} placeholder="Your note..." rows={2} style={{background:'#0f172a',border:'1px solid #334155',borderRadius:6,padding:'6px 10px',color:'#fff',fontSize:13,resize:'none'}}/>
            <div style={{display:'flex',gap:6}}>
              <button onClick={hSave} style={{flex:1,background:'#2563eb',color:'#fff',border:'none',padding:8,borderRadius:6,fontSize:13,fontWeight:500,cursor:'pointer'}}>Save</button>
              <button onClick={()=>setShowAdd(false)} style={{padding:'8px 12px',background:'#334155',color:'#cbd5e1',border:'none',borderRadius:6,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </div>):(<button onClick={()=>setShowAdd(true)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:10,border:'1px dashed #334155',borderRadius:8,color:'#475569',background:'transparent',cursor:'pointer',fontSize:13}}><MessageSquarePlusIcon s={14}/>Add note</button>)}
          {svd&&<p style={{color:'#34d399',fontSize:13,textAlign:'center'}}>Saved!</p>}
        </div>
      </div>
    </div>
  );
}

// ====== LIVE SESSION ======
function LS({session,onAdd,onEnd,onSet}){
  const[segs,setSegs]=useState(session.segments||[]);
  const[part,setPart]=useState('');
  const[sel,setSel]=useState(null);
  const[rec,setRec]=useState(false);
  const[cs,setCs]=useState(session.sourceLang);
  const[ct,setCt]=useState(session.targetLang);
  const[txtIn,setTxtIn]=useState('');
  const er=useRef(null);

  useEffect(()=>{er.current?.scrollIntoView({behavior:'smooth'})},[segs,part]);

  const hdl=useCallback(async(msg)=>{
    if(msg.type==='partial')setPart(msg.text);
    else if(msg.type==='final'){
      const src=msg.text;setPart('');
      const tr=await transText(src,cs,ct);
      const sg={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),src,tgt:tr,ts:Date.now()};
      setSegs(p=>[...p,sg]);onAdd(sg);
    }
  },[cs,ct,onAdd]);

  const spLang=cs==='ru'?'ru-RU':'en-US';
  const{listening,err:se,stop}=useWebSpeech(hdl,spLang);

  const sRec=useCallback(()=>{setRec(true)},[]);
  const eRec=useCallback(()=>{setRec(false);stop()},[stop]);

  const tgl=useCallback(()=>{if(rec)eRec();setCs(p=>p==='ru'?'en':'ru');setCt(p=>p==='en'?'ru':'en');},[rec,eRec]);

  // Manual text input
  const addText=useCallback(async()=>{
    if(!txtIn.trim())return;
    const tr=await transText(txtIn,cs,ct);
    const sg={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),src:txtIn,tgt:tr,ts:Date.now()};
    setSegs(p=>[...p,sg]);onAdd(sg);setTxtIn('');
  },[txtIn,cs,ct,onAdd]);

  // Delete segment
  const delSeg=useCallback((id)=>{setSegs(p=>p.filter(s=>s.id!==id));},[]);

  const cW=(w,l,cx)=>{const cl=w.replace(/[^\w\u0430-\u044f\u0451]/gi,'');if(cl)setSel({word:cl,lang:l,ctx:cx})};
  const rW=(tx,lg)=>tx.split(/(\s+)/).map((w,i)=>/^\s+$/.test(w)?<span key={i}>{w}</span>:gLook(w,lg)?<span key={i} style={{cursor:'pointer',padding:'1px 3px',borderRadius:3,background:'rgba(251,191,36,0.2)',borderBottom:'1px solid #fbbf24',transition:'background .15s'}} onClick={()=>cW(w,lg,tx)} title="Medical term - tap for definition">{w}</span>:<span key={i} style={{cursor:'pointer',padding:'1px 2px',borderRadius:3,transition:'background .15s'}} onClick={()=>cW(w,lg,tx)}>{w}</span>);

  const hasE=se;
  const st=hasE?'Error':listening?'Listening':rec?'Starting...':'Ready';
  const dc=hasE?'#ef4444':listening?'#10b981':'#475569';
  const sLb=cs==='ru'?'Русский':'English';
  const tLb=ct==='en'?'English':'Русский';

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#020617'}}>
      {/* Header */}
      <div style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:'rgba(15,23,42,0.8)',borderBottom:'1px solid #1e293b'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:dc,animation:listening?'pulse 1.5s infinite':undefined}}/>
          <span style={{fontSize:12,fontWeight:500,color:'#64748b',textTransform:'uppercase',letterSpacing:1}}>{st}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <button onClick={tgl} style={{padding:'5px 10px',borderRadius:6,border:'1px solid #334155',background:'#0f172a',color:'#94a3b8',cursor:'pointer',fontSize:11,fontWeight:600}}>{cs.toUpperCase()}{' \u2192 '}{ct.toUpperCase()}</button>
          <button onClick={onSet} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><SettingsIcon s={16}/></button>
        </div>
      </div>
      {hasE&&<div style={{flexShrink:0,padding:'6px 14px',background:'rgba(239,68,68,0.1)',borderBottom:'1px solid rgba(239,68,68,0.2)'}}><p style={{fontSize:11,color:'#f87171'}}>{se}</p></div>}

      {/* Split View */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        {/* Source */}
        <div style={{flex:1,display:'flex',flexDirection:'column',borderBottom:'1px solid #1e293b',minHeight:0}}>
          <div style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'5px 12px',background:'rgba(15,23,42,0.4)'}}>
            <span style={{fontSize:11,fontWeight:'bold',color:'#60a5fa',textTransform:'uppercase',letterSpacing:1}}>{sLb}</span>
            <ChevronUpIcon s={10}/>
          </div>
          <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
            {segs.map(s=>(<div key={s.id} style={{display:'flex',alignItems:'flex-start',gap:6}}>
              <div style={{flex:1}}><p style={{fontSize:15,lineHeight:1.5,color:'#fff'}}>{rW(s.src,cs)}</p><p style={{fontSize:10,color:'#475569',fontFamily:'monospace',marginTop:2}}>{new Date(s.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</p></div>
              <button onClick={()=>delSeg(s.id)} style={{width:22,height:22,borderRadius:'50%',border:'none',background:'transparent',color:'#475569',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}} title="Delete"><XIcon s={12}/></button>
            </div>))}
            {part&&<p style={{fontSize:15,lineHeight:1.5,color:'#94a3b8'}}>{rW(part,cs)}</p>}
            <div ref={er}/>
          </div>
        </div>
        {/* Target */}
        <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
          <div style={{flexShrink:0,display:'flex',alignItems:'center',padding:'5px 12px',background:'rgba(15,23,42,0.4)'}}>
            <span style={{fontSize:11,fontWeight:'bold',color:'#34d399',textTransform:'uppercase',letterSpacing:1}}>{tLb}</span>
          </div>
          <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
            {segs.map(s=>(<div key={s.id}><p style={{fontSize:15,lineHeight:1.5,color:'#a7f3d0'}}>{rW(s.tgt,ct)}</p></div>))}
            {part&&<p style={{fontSize:15,lineHeight:1.5,color:'#34d399',opacity:0.5}}>Translating...</p>}
          </div>
        </div>
      </div>

      {/* Text input + Controls */}
      <div style={{flexShrink:0,padding:'8px 12px',background:'rgba(15,23,42,0.9)',borderTop:'1px solid #1e293b'}}>
        {/* Manual text input */}
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
          <input value={txtIn} onChange={e=>setTxtIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addText()} placeholder={cs==='ru'?'Type Russian...':'Type English...'} style={{flex:1,background:'#0f172a',border:'1px solid #334155',borderRadius:8,padding:'8px 12px',color:'#fff',fontSize:14}}/>
          <button onClick={addText} style={{width:36,height:36,borderRadius:'50%',border:'none',background:'#2563eb',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><SendIcon s={16}/></button>
        </div>
        {/* Mic controls */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14}}>
          {!rec?(
            <button onClick={sRec} className="recording-pulse" style={{width:56,height:56,borderRadius:'50%',border:'none',background:'#dc2626',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 20px rgba(220,38,38,0.3)'}}><MicIcon s={24}/></button>
          ):(
            <>
              <button onClick={eRec} className="recording-pulse" style={{width:56,height:56,borderRadius:'50%',border:'none',background:'#dc2626',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 20px rgba(220,38,38,0.3)'}}><MicOffIcon s={24}/></button>
              <button onClick={onEnd} style={{width:40,height:40,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><BookmarkIcon s={18}/></button>
            </>
          )}
        </div>
        <p style={{textAlign:'center',fontSize:11,color:'#475569',marginTop:6}}>{rec?'Tap red to stop':'Tap mic to speak, or type above'}</p>
      </div>
      {sel&&<WModal word={sel.word} lang={sel.lang} ctx={sel.ctx} onClose={()=>setSel(null)}/>}
    </div>
  );
}

// ====== SAVED SESSIONS ======
function SS({sessions,onBack,onView,onDel,onExp}){
  const[srch,setSrch]=useState('');
  const[dlId,setDlId]=useState(null);
  const flt=sessions.filter(s=>s.title.toLowerCase().includes(srch.toLowerCase())||s.segments.some(sg=>sg.src.toLowerCase().includes(srch.toLowerCase())));
  const dEx=(s)=>{const b=new Blob([onExp(s)],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=s.title.replace(/\s+/g,'_')+'_'+new Date(s.createdAt).toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(u)};
  const dPr=(s)=>{const pw=window.open('','_blank');if(pw){pw.document.write('<html><head><title>'+s.title+'</title><style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:20px;line-height:1.6;color:#333}h1{font-size:20px;border-bottom:2px solid #333;padding-bottom:10px}.meta{color:#666;font-size:13px;margin-bottom:30px}.sg{margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #eee}.tm{color:#999;font-size:11px}.sr{font-weight:bold;margin:5px 0}.tg{color:#555;font-style:italic}</style></head><body><h1>'+s.title+'</h1><div class="meta">'+new Date(s.createdAt).toLocaleString()+'|'+s.sourceLang+'\u2192'+s.targetLang+'|'+Math.round(s.duration/60)+'min</div>'+s.segments.map(x=>'<div class="sg"><div class="tm">'+new Date(x.ts).toLocaleTimeString()+'</div><div class="sr">'+x.src+'</div><div class="tg">'+x.tgt+'</div></div>').join('')+'</body></html>');pw.document.close();pw.print()}};
  const cDel=(id)=>{if(dlId===id){onDel(id);setDlId(null)}else{setDlId(id);setTimeout(()=>setDlId(null),3000)}};
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#020617'}}>
      <div style={{flexShrink:0,display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'rgba(15,23,42,0.8)',borderBottom:'1px solid #1e293b'}}>
        <button onClick={onBack} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><ArrowLeftIcon s={18}/></button>
        <h1 style={{fontSize:16,fontWeight:600}}>Saved</h1>
        <span style={{fontSize:11,background:'#1e293b',color:'#94a3b8',padding:'2px 8px',borderRadius:10}}>{sessions.length}</span>
      </div>
      <div style={{flexShrink:0,padding:'6px 14px'}}>
        <div style={{position:'relative'}}>
          <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#475569'}}><SearchIcon s={14}/></div>
          <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Search..." style={{width:'100%',background:'#0f172a',border:'1px solid #1e293b',borderRadius:10,padding:'8px 10px 8px 30px',color:'#fff',fontSize:13}}/>
        </div>
      </div>
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'0 14px 14px',display:'flex',flexDirection:'column',gap:6}}>
        {flt.length===0&&<div style={{textAlign:'center',padding:40,color:'#475569'}}><FileTextIcon s={36}/><p style={{fontSize:13,marginTop:10}}>No sessions</p></div>}
        {flt.map(s=>(
          <div key={s.id} style={{padding:12,borderRadius:10,background:'rgba(15,23,42,0.6)',border:'1px solid #1e293b'}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:6}}>
              <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={()=>onView(s.id)}>
                <h3 style={{fontWeight:500,color:'#fff',fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</h3>
                <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4,fontSize:11,color:'#475569'}}>
                  <span style={{display:'flex',alignItems:'center',gap:3}}><CalendarIcon s={10}/>{new Date(s.createdAt).toLocaleDateString()}</span>
                  <span style={{color:'#60a5fa'}}>{s.sourceLang}\u2192{s.targetLang}</span>
                </div>
              </div>
              <div style={{display:'flex',gap:2}}>
                <button onClick={()=>dEx(s)} style={{width:28,height:28,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><DownloadIcon s={12}/></button>
                <button onClick={()=>dPr(s)} style={{width:28,height:28,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><PrinterIcon s={12}/></button>
                <button onClick={()=>cDel(s.id)} style={{width:28,height:28,borderRadius:'50%',border:'none',background:dlId===s.id?'rgba(239,68,68,0.2)':'#1e293b',color:dlId===s.id?'#f87171':'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><TrashIcon s={12}/></button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ====== SESSION VIEWER ======
function SV({session,onBack,onExp}){
  const dEx=()=>{const b=new Blob([onExp(session)],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=session.title.replace(/\s+/g,'_')+'_'+new Date(session.createdAt).toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(u)};
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#020617'}}>
      <div style={{flexShrink:0,display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'rgba(15,23,42,0.8)',borderBottom:'1px solid #1e293b'}}>
        <button onClick={onBack} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><ArrowLeftIcon s={18}/></button>
        <h1 style={{fontSize:16,fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{session.title}</h1>
        <button onClick={dEx} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'#1e293b',color:'#94a3b8',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><DownloadIcon s={14}/></button>
      </div>
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto'}}>
        <div style={{maxWidth:672,margin:'0 auto',padding:14,display:'flex',flexDirection:'column',gap:14}}>
          {session.segments.length===0&&<p style={{textAlign:'center',color:'#475569',padding:40}}>Empty</p>}
          {session.segments.map(s=>(<div key={s.id} style={{paddingBottom:12,borderBottom:'1px solid rgba(30,41,59,0.5)'}}>
            <span style={{fontSize:10,color:'#475569',fontFamily:'monospace'}}>{new Date(s.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
            <p style={{fontSize:15,color:'#fff',marginTop:4,lineHeight:1.5}}>{s.src}</p>
            <p style={{fontSize:15,color:'#a7f3d0',lineHeight:1.5}}>{s.tgt}</p>
          </div>))}
        </div>
      </div>
    </div>
  );
}

// ====== MAIN APP ======
function App(){
  const[view,setView]=useState('live');
  const[vid,setVid]=useState(null);
  const[sn,setSn]=useState(false);
  const[ttl,setTtl]=useState('');
  const[sl,setSl]=useState('ru');
  const[tl,setTl]=useState('en');
  const[ss,setSs]=useState([]);
  const[cs,setCs]=useState(null);
  const[ld,setLd]=useState(false);

  useEffect(()=>{setSs(loadSess());setCs(loadCur());setLd(true)},[]);
  useEffect(()=>{if(ld)saveSess(ss)},[ss,ld]);
  useEffect(()=>{saveCur(cs)},[cs]);

  const crt=useCallback(()=>{const t=ttl.trim()||'Session '+new Date().toLocaleString();const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:t,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),segments:[],sourceLang:sl,targetLang:tl,duration:0};setCs(s);setSn(false);setTtl('');setView('live')},[ttl,sl,tl]);
  const aSeg=useCallback((sg)=>{setCs(p=>p?{...p,segments:[...p.segments,sg],updatedAt:new Date().toISOString()}:p)},[]);
  const eSess=useCallback(()=>{if(!cs)return;const f={...cs,updatedAt:new Date().toISOString(),duration:Math.round((Date.now()-new Date(cs.createdAt).getTime())/1000)};setSs(p=>[f,...p]);setCs(null);saveCur(null);setView('sessions')},[cs]);
  const dSess=useCallback((id)=>setSs(p=>p.filter(s=>s.id!==id)),[]);
  const expS=(s)=>{const ls=['Session: '+s.title,'Date: '+new Date(s.createdAt).toLocaleString(),'Lang: '+s.sourceLang+'\u2192'+s.targetLang,'Dur: '+Math.round(s.duration/60)+'min','','---TRANSCRIPT---',''];for(const x of s.segments){ls.push('['+new Date(x.ts).toLocaleTimeString()+']',s.sourceLang.toUpperCase()+': '+x.src,s.targetLang.toUpperCase()+': '+x.tgt,'')}return ls.join('\n')};
  const vw=vid?ss.find(s=>s.id===vid):null;

  if(!ld)return<div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:'#020617'}}><div style={{width:32,height:32,border:'2px solid #2563eb',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 1s linear infinite'}}/></div>;

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#020617'}}>
      <div style={{flex:1,overflow:'hidden',minHeight:0}}>
        {!cs&&view==='live'&&(<div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px'}}>
          <div style={{width:72,height:72,borderRadius:'50%',background:'rgba(37,99,235,0.1)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}><MicIcon s={32}/></div>
          <h1 style={{fontSize:24,fontWeight:'bold',marginBottom:6}}>Constance</h1>
          <p style={{color:'#475569',textAlign:'center',fontSize:13,marginBottom:28,maxWidth:260}}>Real-time transcription and translation for medical research interpreting.</p>
          <button onClick={()=>setSn(true)} style={{width:'100%',maxWidth:280,background:'#2563eb',color:'#fff',border:'none',padding:14,borderRadius:14,fontSize:16,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10,boxShadow:'0 4px 20px rgba(37,99,235,0.3)'}}><PlusIcon s={20}/>New Session</button>
          <p style={{color:'#334155',fontSize:11,marginTop:20}}>Russian to English - Free - No signup</p>
        </div>)}
        {cs&&view==='live'&&<LS session={cs} onAdd={aSeg} onEnd={eSess} onSet={()=>{}}/>}
        {view==='sessions'&&<SS sessions={ss} onBack={()=>setView('live')} onView={id=>{setVid(id);setView('detail')}} onDel={dSess} onExp={expS}/>}
        {view==='detail'&&vw&&<SV session={vw} onBack={()=>setView('sessions')} onExp={expS}/>}
      </div>
      {(cs||view!=='live'||ss.length>0)&&(
        <div style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-around',background:'rgba(15,23,42,0.9)',borderTop:'1px solid #1e293b',backdropFilter:'blur(12px)',paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
          <button onClick={()=>setView('live')} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'8px 16px',borderRadius:12,border:'none',background:'transparent',color:view==='live'?'#60a5fa':'#475569',fontSize:10,fontWeight:500,cursor:'pointer'}}><MicIcon s={20}/><span>Live</span></button>
          <button onClick={()=>setSn(true)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'8px 16px',borderRadius:12,border:'none',background:'transparent',color:'#475569',fontSize:10,fontWeight:500,cursor:'pointer'}}><PlusIcon s={20}/><span>New</span></button>
          <button onClick={()=>setView('sessions')} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'8px 16px',borderRadius:12,border:'none',background:'transparent',color:view==='sessions'||view==='detail'?'#60a5fa':'#475569',fontSize:10,fontWeight:500,cursor:'pointer'}}><ArchiveIcon s={20}/><span>Saved</span></button>
        </div>
      )}

      {sn&&<div className="modal-bg" onClick={()=>setSn(false)}>
        <div className="modal-panel" style={{padding:16}} onClick={e=>e.stopPropagation()}>
          <h2 style={{fontSize:16,fontWeight:600,marginBottom:12}}>New Session</h2>
          <input value={ttl} onChange={e=>setTtl(e.target.value)} onKeyDown={e=>e.key==='Enter'&&crt()} placeholder="Session name..." autoFocus style={{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:8,padding:'10px 14px',color:'#fff',fontSize:15,marginBottom:10}}/>
          <div style={{display:'flex',gap:10,marginBottom:12}}>
            <div style={{flex:1}}><label style={{fontSize:11,color:'#475569',display:'block',marginBottom:3}}>From</label><select value={sl} onChange={e=>setSl(e.target.value)} style={{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:6,padding:'6px 10px',color:'#fff',fontSize:13}}><option value="ru">Russian</option><option value="en">English</option></select></div>
            <div style={{flex:1}}><label style={{fontSize:11,color:'#475569',display:'block',marginBottom:3}}>To</label><select value={tl} onChange={e=>setTl(e.target.value)} style={{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:6,padding:'6px 10px',color:'#fff',fontSize:13}}><option value="en">English</option><option value="ru">Russian</option></select></div>
          </div>
          <button onClick={crt} style={{width:'100%',background:'#2563eb',color:'#fff',border:'none',padding:12,borderRadius:10,fontSize:15,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><CheckIcon s={16}/>Start</button>
        </div>
      </div>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
